name: Daily database backup

# Nightly dump of the Neon database into the `db-backups` branch.
#
# WHY A CONTAINER INSTEAD OF `apt-get install postgresql-client-18`
#
#   pg_dump refuses to dump a server NEWER than the client:
#       server version: 18.6 | pg_dump version: 16.15
#
# ubuntu-24.04 runners ship client 16, and PostgreSQL 17/18 live in the
# upstream PGDG repository. Adding PGDG and trying 19/18/17/16 looked like
# the fix but was fragile: whichever version the loop happened to land on
# depended on what the repo happened to carry that day, and the failures
# were swallowed by `2>/dev/null`. The job then died with a confusing
# "server version mismatch" and no clue why.
#
# Running pg_dump from a matching container removes the guessing entirely:
# the image tag pins the major version, so the client is always >= the
# server. Bump the tag when Neon moves to a newer major.
on:
  schedule:
    - cron: '0 21 * * *'      # 03:00 Bangladesh time
  workflow_dispatch:          # manual trigger from the Actions tab

permissions:
  contents: write

concurrency:
  group: db-backup
  cancel-in-progress: false

env:
  # Client major version. Must be >= the Neon server's major (18 right now).
  PG_IMAGE: postgres:18-alpine

jobs:
  backup:
    name: Dump and commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (main branch; dumps live on the db-backups branch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Verify the dump client
        run: |
          set -euo pipefail
          docker run --rm "$PG_IMAGE" pg_dump --version
          docker run --rm "$PG_IMAGE" pg_restore --version

      # `set -o pipefail` is essential on `pg_dump | gzip`. Without it a
      # failing pg_dump still produces a VALID (but empty) gzip archive, the
      # step reports success, and a broken snapshot gets committed as if it
      # were a good backup - which is exactly what the first runs did.
      - name: Create schema-only dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p .backup
          docker run --rm "$PG_IMAGE" \
            pg_dump "$DATABASE_URL" --schema-only --no-owner --no-privileges \
            | gzip -9 > .backup/schema.sql.gz

          # `test -s` is NOT enough (see note above) - verify the archive
          # really unzips and really contains DDL.
          gzip -t .backup/schema.sql.gz
          gzip -dc .backup/schema.sql.gz | grep -q "CREATE TABLE"
          echo "schema dump OK: $(gzip -dc .backup/schema.sql.gz | grep -c 'CREATE TABLE') CREATE TABLE statements"

      - name: Commit schema snapshot to the main branch
        run: |
          set -euo pipefail
          git config user.name  "polyattend-backup-bot"
          git config user.email "actions@github.com"
          git add .backup/schema.sql.gz
          if git diff --cached --quiet; then
            echo "schema unchanged, nothing to commit"
          else
            git commit -m "chore(db): schema snapshot $(date -u +%Y-%m-%dT%H%MZ)"
            git push
          fi

      - name: Create full data dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p .backups
          STAMP=$(date -u +%Y-%m-%d)
          FILE="polyattend-${STAMP}.dump"

          # The archive is written INSIDE the container to a mounted folder
          # rather than piped out to stdout. Custom format (-Fc) is a
          # seekable format, so letting it be piped would produce an
          # archive pg_restore cannot read.
          docker run --rm \
            -v "$PWD/.backups:/out" \
            "$PG_IMAGE" \
            pg_dump "$DATABASE_URL" \
              --clean --if-exists --no-owner --no-privileges \
              --format=custom --file "/out/$FILE"

          test -s ".backups/$FILE" || { echo "::error::dump is empty"; exit 1; }

          # Guard against committing an empty dump over a good one: the
          # archive index must actually list tables with data.
          ENTRIES=$(docker run --rm -v "$PWD/.backups:/out:ro" "$PG_IMAGE" \
            pg_restore --list "/out/$FILE" | grep -c 'TABLE DATA' || true)
          if [ "$ENTRIES" -lt 1 ]; then
            echo "::error::dump contains no TABLE DATA entries - refusing to commit a bad backup"
            exit 1
          fi
          echo "dump contains $ENTRIES tables with data"
          ls -lh .backups/

      - name: Push the data dump to the db-backups branch
        run: |
          set -euo pipefail
          git config user.name  "polyattend-backup-bot"
          git config user.email "actions@github.com"
          git checkout -B db-backups
          # Keep only the newest 30 snapshots so the repo cannot grow forever.
          ls -1t .backups/*.dump 2>/dev/null | tail -n +31 | xargs -r rm -f
          git add -A .backups
          if git diff --cached --quiet; then
            echo "no data changes today"
          else
            git commit -m "backup: $(date -u +%Y-%m-%dT%H%MZ)"
          fi
          git push --force origin db-backups
